# Réglages de PSN Amis.
#
# Ce fichier est copié en « reglages.toml » au premier lancement : c'est reglages.toml
# qu'il faut modifier (avec le Bloc-notes), puis relancer PSN Amis. Un réglage absent
# garde sa valeur par défaut ; un réglage mal écrit est signalé au démarrage, et sa
# valeur par défaut est utilisée.

# Secondes entre deux vérifications : les demandes reçues sont acceptées, puis la liste
# d'amis est recomptée. Entre 5 et 3600. Avec 15, PSN Amis fait 8 requêtes par minute
# quand il ne se passe rien ; PSNAWP, la bibliothèque utilisée, en autorise 20.
intervalle_verification = 15

# Secondes de pause entre deux acceptations (entre 0 et 60).
pause_entre_acceptations = 2

# Nombre maximum d'amis sur un compte PSN (limite officielle de Sony).
limite_amis = 2000

# Couleurs du tableau de bord : "sombre" (au départ), "doux" (couleurs plus calmes)
# ou "daltonien" (bleu, jaune, orange : plus faciles à distinguer sans le rouge et
# le vert).
theme = "sombre"

# Bulles de notification Windows pour les événements importants seulement : code npsso
# à changer, liste d'amis pleine, coupure Internet qui dure.
notifications = true

# Petit bip à chaque ajout. La touche S change ce réglage en cours de route.
son = false

# Pause automatique après ce nombre d'ajouts depuis la dernière reprise, par exemple
# quand une partie est pleine. 0 : jamais de pause automatique. Touche P pour reprendre.
pause_apres_ajouts = 0

# Pseudos (ou identifiants de compte) à ne jamais accepter. Majuscules et minuscules
# sans importance. Exemple : liste_noire = ["Indesirable_42", "SpamBot"]
liste_noire = []

# Si cette liste n'est pas vide, seuls ces pseudos (ou identifiants) sont acceptés.
liste_blanche = []

# Vérifier au démarrage si une nouvelle version de PSN Amis existe sur GitHub.
# C'est la seule requête qui ne va pas chez Sony : elle est coupée au départ.
verifier_mises_a_jour = false

# Garder le code npsso dans le Gestionnaire d'identification de Windows (chiffré par
# votre session Windows) plutôt que dans le fichier npsso.txt.
coffre_windows = true
